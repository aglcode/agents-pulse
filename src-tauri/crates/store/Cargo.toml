[package]
name = "agentpulse-store"
version = "0.1.0"
edition = "2024"

[dependencies]
agentpulse-core = { version = "0.1.0", path = "../core" }
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["sync", "rt", "time"] }
tracing = "0.1.44"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "time"] }

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
