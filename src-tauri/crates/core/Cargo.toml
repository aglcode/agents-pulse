[package]
name = "agentpulse-core"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1.92"
hex = "0.4.3"
secrecy = { version = "0.10.3", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio-util = "0.7.20"
ts-rs = "12.0.1"
zeroize = "1.9.1"

[dev-dependencies]
serde_json = "1.0.154"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
