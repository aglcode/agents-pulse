[package]
name = "agents-pulse"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "agents_pulse_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
agentpulse-core = { version = "0.1.0", path = "crates/core" }
agentpulse-store = { version = "0.1.0", path = "crates/store" }
agentpulse-engine = { version = "0.1.0", path = "crates/engine" }
agentpulse-collectors = { version = "0.1.0", path = "crates/collectors", features = ["mock"] }
tauri-plugin-single-instance = "2.5.5"
anyhow = "1.0.104"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tokio = { version = "1.54.1", features = ["sync", "time", "macros"] }
tokio-util = { version = "0.7.20", features = ["rt"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
# unwind (not abort) so a panicking collector task is isolated instead of killing the app.
panic = "unwind"
strip = true

[workspace]
members = ["crates/*"]
resolver = "3"
